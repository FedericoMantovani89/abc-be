spring:
  application:
    name: abc-musical

  config:
    # Configurazione esterna facoltativa (cartella /config montata dal compose): se i file ci sono
    # vincono sui valori del pacchetto, se non ci sono non succede nulla. Serve un riavvio.
    import:
      - optional:file:${APP_CONFIG_DIR:/config}/application.yml
      - optional:file:${APP_CONFIG_DIR:/config}/application-prod.yml

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:abc}
    username: ${DB_USER:abc}
    password: ${DB_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: validate        # Flyway gestisce lo schema
    open-in-view: false

  data:
    web:
      pageable:
        # VIA_DTO: serializza le Page come PagedModel ({content, page:{...}}).
        # Necessario perche' Spring Data 4 avvisa che la forma di PageImpl non e' stabile.
        serialization-mode: via-dto

  flyway:
    enabled: true
    locations: classpath:db/migration

  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    # SSL/STARTTLS e timeout li imposta MailConfig da app.mail.* (SMTP_SSL=true -> SSL diretto, porta 465).
    properties:
      mail.smtp.auth: true

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 105MB

app:
  # Accessi social facoltativi: con id o segreto vuoti il provider non viene registrato (vedi SocialLoginConfig).
  social:
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
    facebook:
      client-id: ${FACEBOOK_CLIENT_ID:}
      client-secret: ${FACEBOOK_CLIENT_SECRET:}
  base-url: ${APP_BASE_URL:https://www.attoriballerinicantanti.it}
  frontend-url: ${APP_FRONTEND_URL:https://www.attoriballerinicantanti.it}
  upload-dir: ${APP_UPLOAD_DIR:./uploads}
  # Cartella della configurazione esterna: application-prod.yml, messages.properties, email/.
  config-dir: ${APP_CONFIG_DIR:/config}
  jwt:
    secret: ${JWT_SECRET:}
    expiration: ${JWT_EXPIRATION:3600}
    rememberme-expiration: ${JWT_REMEMBERME_EXPIRATION:2592000}
    issuer: abc-musical
  security:
    remember-me-key: ${REMEMBER_ME_KEY:}
  upload:
    chunk-size-mb: ${UPLOAD_CHUNK_SIZE_MB:8}
    session-ttl-hours: ${UPLOAD_SESSION_TTL_HOURS:24}
  audit:
    retention-months: ${AUDIT_LOG_RETENTION_MONTHS:12}
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
  thumbs:
    ffmpeg: ${FFMPEG_PATH:ffmpeg}
  mail:
    # Aruba rifiuta mittenti diversi dall'utente SMTP: MAIL_FROM deve coincidere con SMTP_USER.
    from: ${MAIL_FROM:info@attoriballerinicantanti.it}
    from-name: ${MAIL_FROM_NAME:ABC Musical Company}
    reply-to: ${MAIL_REPLY_TO:}
    verification-subject: "Conferma il tuo indirizzo email — ABC Musical Company"
    reset-subject: "Reimposta la password — ABC Musical Company"
    ssl: ${SMTP_SSL:false}            # true = SSL diretto sulla 465 (Aruba); false = STARTTLS sulla 587
    connection-timeout-ms: ${SMTP_CONNECTION_TIMEOUT_MS:10000}
    read-timeout-ms: ${SMTP_READ_TIMEOUT_MS:10000}
    write-timeout-ms: ${SMTP_WRITE_TIMEOUT_MS:10000}
    templates-dir: ${app.config-dir}/email
  associazione:
    nome: "ABC - Attori Ballerini Cantanti APS"
    email: info@attoriballerinicantanti.it
    sede: "Via Interna Molini 1C, 37132 Verona (VR)"
    cf: "93242450232"
    piva: "04443330230"
    runts: ${ASSOCIAZIONE_RUNTS:2716 del 04/07/2022}
  cors:
    # Origini ammesse oltre al sito (app.frontend-url). Vuota in produzione; in sviluppo vedi application-dev.yml.
    extra-origins: []
  limits:
    verification-link-hours: 24
    reset-link-hours: 1
    auth-requests-per-hour: 20

management:
  endpoints:
    web:
      exposure:
        include: health          # solo health, senza dettagli: info e il resto restano spenti
  endpoint:
    health:
      show-details: never
      show-components: never
      group:
        # Usato dall'healthcheck del compose: SOLO cio' che serve perche' il sito stia in piedi.
        # La posta resta fuori: un guasto di Aruba non deve fermare backend, frontend e Caddy.
        sito:
          include: ping,db
        # Stato della posta, per chi guarda l'actuator da dentro (wget http://localhost:8080/actuator/health/posta).
        posta:
          include: mail

server:
  port: 8080
  error:
    # Nessun dettaglio interno nelle risposte di errore (lo stack trace va solo nel log).
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false
  forward-headers-strategy: framework
  tomcat:
    max-swallow-size: 110MB
